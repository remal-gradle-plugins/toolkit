project.ext['publish.any'] = false

apply plugin: 'java-gradle-plugin'

dependencies {
    classesRelocation project(':toolkit')

    testImplementation project(':testkit')
}

gradlePlugin {
    plugins {
        create('testsFunctional') {
            id = 'name.remal.toolkit.tests-functional'
            implementationClass = 'name.remal.gradle_plugins.toolkit.tests_functional.TestsFunctionalPlugin'
            displayName = 'Toolkit Functional Tests'
        }
        create('settingsAwarePluginFixture') {
            id = 'name.remal.toolkit.tests-functional.settings-aware-plugin-fixture'
            implementationClass = 'name.remal.gradle_plugins.toolkit.tests_functional.SettingsAwarePluginFixture'
            displayName = 'Settings-aware plugin fixture (for functional tests only)'
        }
    }
}
