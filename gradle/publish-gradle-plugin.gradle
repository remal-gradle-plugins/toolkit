import java.beans.Introspector
import java.lang.reflect.Method
import org.gradle.work.DisableCachingByDefault

if (project.isBuildSrcProject) {
    return
}

allprojects {
    pluginManager.withPlugin('java-gradle-plugin') {
        // Set the `publish.any` property to `false` to force `publish.gradle-plugin` off,
        // regardless of its own value. `publish.any` set to `true` or left unset has no effect here.
        boolean publishGradlePlugin = !Boolean.FALSE.equals(findProperty('publish.gradle-plugin')?.toString()?.toBoolean())
            && !Boolean.FALSE.equals(findProperty('publish.any')?.toString()?.toBoolean())
        if (!publishGradlePlugin) {
            gradlePlugin.automatedPublishing = false
            return
        }


        apply plugin: 'com.gradle.plugin-publish'

        gradlePlugin {
            website = githubRepositoryInfo.repository.map { it.htmlUrl }
            vcsUrl = website
            plugins.all { PluginDeclaration plugin ->
                plugin.description = plugin.description ?: githubRepositoryInfo.repository.map { it.description }

                plugin.tags.addAll(githubRepositoryInfo.repository.map { repo ->
                    repo.topics
                        .collect { it.trim().toLowerCase() }
                        .findAll { !it.isEmpty() }
                        .findAll { it != 'gradle' && it != 'plugin' && it != 'gradle-plugin' }
                })

                if (plugin.name.startsWith('name.remal.')) {
                    String pluginNameTag = plugin.name.substring('name.remal.'.length())
                    if (!pluginNameTag.isEmpty()) {
                        plugin.tags.add(pluginNameTag)
                    }
                }
            }
        }

        TaskProvider validatePluginProperties = tasks.register('validatePluginProperties', ValidatePluginProperties) {
            GradlePluginDevelopmentExtension gradlePlugin = project.gradlePlugin
            gradlePlugins = gradlePlugin
        }
        tasks.named('check').configure { dependsOn(validatePluginProperties) }

        pluginManager.withPlugin('maven-publish') {
            afterEvaluate {
                publishing.publications.withType(MavenPublication).matching { it.component != null }.forEach { pub ->
                    MavenArtifactSet artifacts = pub.artifacts
                    ['sources', 'javadoc', 'groovydoc'].forEach { classifier ->
                        if (!artifacts.any { it.classifier == classifier }) {
                            Jar jarTask = tasks.withType(Jar).find { it.archiveClassifier.getOrNull() == classifier }
                            if (jarTask != null) {
                                pub.artifact(jarTask)
                            }
                        }
                    }
                }
            }
        }

        pluginManager.withPlugin('name.remal.generate-sources') {
            tasks.matching { it.name == 'publishPluginJar' }.configureEach {
                Set<String> generateTasks = [
                    'generateResources',
                    'generateJava',
                    'generateKotlin',
                    'generateGroovy',
                ].toSet()
                dependsOn(
                    tasks.matching { generateTasks.contains(it.name) }
                )
            }
        }
    }
}


File flagFile = project.layout.buildDirectory.file('publish-gradle-plugin.flag').get().asFile
flagFile.delete()

gradle.projectsEvaluated {
    // `publish.gradle-plugin` and `publish.any` can be read here even if they were set after
    // `java-gradle-plugin` / `com.gradle.plugin-publish` were already applied elsewhere in a
    // project's build script. This cannot make a project start publishing that never applied
    // `com.gradle.plugin-publish` in the first place - it can only stop one that did.
    boolean anyGradlePluginPublications = false
    rootProject.allprojects { Project publishingProject ->
        if (!publishingProject.pluginManager.hasPlugin('com.gradle.plugin-publish')) {
            return
        }

        boolean publishGradlePlugin = !Boolean.FALSE.equals(publishingProject.findProperty('publish.gradle-plugin')?.toString()?.toBoolean())
            && !Boolean.FALSE.equals(publishingProject.findProperty('publish.any')?.toString()?.toBoolean())
        if (!publishGradlePlugin) {
            publishingProject.tasks.matching { it.name == 'publishPlugins' }.configureEach { disableTask(it) }
        } else {
            anyGradlePluginPublications = true
        }
    }

    if (anyGradlePluginPublications) {
        flagFile.parentFile.mkdirs()
        flagFile.createNewFile()
    }
}

/* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */

@DisableCachingByDefault(because = "Should not be cached")
abstract class ValidatePluginProperties extends DefaultTask implements VerificationTask {

    @Internal
    abstract Property<GradlePluginDevelopmentExtension> getGradlePlugins()

    ValidatePluginProperties() {
        outputs.upToDateWhen { false }
        group = "plugin development"
    }

    @TaskAction
    void execute() {
        GradlePluginDevelopmentExtension gradlePlugins = this.gradlePlugins.get()
        if (gradlePlugins.website.orNull?.isEmpty() != false) {
            throw new GradleException("Website can't be empty for Gradle plugins")
        }
        if (gradlePlugins.vcsUrl.orNull?.isEmpty() != false) {
            throw new GradleException("VCS URL can't be empty for Gradle plugins")
        }
        // `CompatibleFeatures` (from the `org.gradle.plugin-compatibility` plugin, applied transitively
        // by `com.gradle.plugin-publish`) lives in a plugin-isolated classloader, so it can't be imported
        // or referenced as a static type here. Discover its `Property`-returning getters reflectively
        // instead, off the first plugin's `features` instance, and reuse that for the rest.
        List<Method> compatibilityFeatureGetters = null

        gradlePlugins.plugins.forEach { plugin ->
            if (plugin.id?.isEmpty() != false) {
                throw new GradleException("Gradle plugin `${plugin.id}` has empty `id`")
            }
            if (plugin.implementationClass?.isEmpty() != false) {
                throw new GradleException("Gradle plugin `${plugin.id}` has empty `implementationClass`")
            }
            if (plugin.displayName?.isEmpty() != false) {
                throw new GradleException("Gradle plugin `${plugin.id}` has empty `displayName`")
            }
            if (plugin.description?.isEmpty() != false) {
                throw new GradleException("Gradle plugin `${plugin.id}` has empty `description`")
            }
            if (plugin.tags.orNull?.isEmpty() != false) {
                throw new GradleException("Gradle plugin `${plugin.id}` has empty `tags")
            }

            def features = plugin.compatibility.features
            if (compatibilityFeatureGetters == null) {
                compatibilityFeatureGetters = features.class.methods.findAll {
                    Property.isAssignableFrom(it.returnType) && it.parameterCount == 0
                }
                assert compatibilityFeatureGetters.any { it.name == 'getConfigurationCache' } :
                    "Reflection over the `compatibility.features` extension didn't find `getConfigurationCache`; the feature-discovery logic is broken"
            }
            compatibilityFeatureGetters.forEach { Method getter ->
                Property<?> property = getter.invoke(features) as Property<?>
                if (!property.isPresent()) {
                    String featureName = Introspector.decapitalize(getter.name.substring(3))
                    throw new GradleException("Gradle plugin `${plugin.id}` has no `compatibility.features.${featureName}` set")
                }
            }
        }
    }

    @Override
    void setIgnoreFailures(boolean ignoreFailures) {
        // do nothing
    }

    @Override
    boolean getIgnoreFailures() {
        return false
    }

}
