if (project.isBuildSrcProject) {
    return
}

// Global, cross-project registry of the exact files backing dependencies that are already
// guaranteed to get a plain "group:artifact:version" line somewhere in the merged output file.
// Written only from resolveGradlePluginApiDependencyFiles's own doLast (each project resolving its
// own gradlePluginApiDependenciesConf under its own project lock -- see below for why that matters)
// and read only after every such task has run (enforced via dependsOn in
// gradle-plugin-collect-classes-relying-on-dependencies.gradle), so finalizeValueOnRead() never
// trips on a late write.
SetProperty<File> trackedGradlePluginApiDependencyFiles = project.objects.setProperty(File)
    .with { it.finalizeValueOnRead(); it }

allprojects {
    project.ext.trackedGradlePluginApiDependencyFiles = trackedGradlePluginApiDependencyFiles

    pluginManager.withPlugin('java-gradle-plugin') {
        project.ext.nonJavaApiDependencies = project.objects.setProperty(String)

        configurations.indirectApi.withDependencies { deps ->
            Collection<String> mainConfNames = project.getSourceSetConfigurationNames(sourceSets.main)
            configurations.matching { mainConfNames.contains(it.name) }.forEach { Configuration conf ->
                conf.allDependencies
                    .matching { it.group == 'org.ow2.asm' }
                    .collect { Dependency dep ->
                        if (isPlatformDependency(dep)) {
                            return "${dep.group}:${dep.name}:${dep.version}:@pom"
                        } else {
                            return dep.copy()
                        }
                    }
                    .forEach { Object notation ->
                        deps.add(project.dependencies.create(notation))
                    }
            }
        }

        Configuration gradlePluginApiDependenciesConf = configurations.create('gradlePluginApiDependencies') { Configuration conf ->
            conf.canBeResolved = true
            conf.canBeConsumed = false
            conf.extendsFrom(configurations.api)
            conf.extendsFrom(configurations.indirectApi)
        }

        // Captured at configuration time so collectTrackedResolvedDependencies below (called from
        // execution-time doLast blocks) never has to reach through a live Project reference.
        String projectPath = project.path

        // Moved out of doLast below so it can be shared with resolveGradlePluginApiDependencyFiles's
        // doLast (registered further down).
        Closure<Boolean> isExcludedCategory = { ResolvedDependencyResult resolvedDependency ->
            return isPlatformDependency(resolvedDependency) || isDocumentationDependency(resolvedDependency) || isVerificationDependency(resolvedDependency)
        }

        // Single source of truth for "which resolved dependencies are eligible for a plain line"
        // -- used both by doLast below (unchanged behavior) and by trackedGradlePluginApiDependencyFiles.
        // Extracted from the two blocks that used to be inlined directly in doLast. Also the one
        // place that forbids a SNAPSHOT dependency from ever being tracked: since both consumers
        // go through here, neither has to special-case snapshots itself.
        Closure<List<ResolvedDependencyResult>> collectTrackedResolvedDependencies = { ->
            List<ResolvedDependencyResult> result = []
            result.addAll(
                gradlePluginApiDependenciesConf.incoming.resolutionResult
                    .root
                    .dependencies
                    .findAll { it instanceof ResolvedDependencyResult }
                    .collect { (ResolvedDependencyResult) it }
                    .findAll { !isExcludedCategory(it) }
            )
            result.addAll(
                gradlePluginApiDependenciesConf.incoming.resolutionResult
                    .allDependencies
                    .findAll { it instanceof ResolvedDependencyResult }
                    .collect { (ResolvedDependencyResult) it }
                    .findAll { !isExcludedCategory(it) }
                    .findAll { !it.selected.selectionReason.expected }
            )

            result.forEach { ResolvedDependencyResult resolvedDependency ->
                def selectedId = resolvedDependency.selected.id
                if (selectedId instanceof ModuleComponentIdentifier && selectedId.version.endsWith('-SNAPSHOT')) {
                    throw new GradleException(
                        "${projectPath}: gradlePluginApiDependencies must not resolve a SNAPSHOT dependency,"
                            + " but got ${selectedId.group}:${selectedId.module}:${selectedId.version}."
                            + " Pin it to a released version."
                    )
                }
            }

            return result
        }

        // Gradle forbids resolving a Configuration from a thread executing a *different*
        // project's task ("attempted without an exclusive lock") -- confirmed by running this
        // under org.gradle.parallel=true: two collectGradlePluginApiDependencies tasks in
        // different projects each threw while evaluating the *other* project's
        // gradlePluginApiDependencies conf during nonJavaApiDependencies input fingerprinting.
        // So resolution of THIS project's gradlePluginApiDependenciesConf must only ever happen
        // inside THIS project's own task execution -- never lazily, from a Provider that some
        // other project's task might realize. This dedicated, output-less task (same shape as
        // registerResolveSourceSetRuntimeClasspathTask in helpers.gradle) is that safe execution
        // point: it always runs, resolves this project's own conf under this project's own lock,
        // and pushes the resulting files into the global set from inside doLast.
        tasks.register('resolveGradlePluginApiDependencyFiles') { Task task ->
            task.doLast {
                logger.info("resolveGradlePluginApiDependencyFiles: resolving own gradlePluginApiDependencies conf")
                Collection<ResolvedArtifact> resolvedArtifacts = gradlePluginApiDependenciesConf.resolvedConfiguration.resolvedArtifacts
                Set<File> files = new LinkedHashSet<File>()
                collectTrackedResolvedDependencies().forEach { ResolvedDependencyResult resolvedDependency ->
                    def selectedId = resolvedDependency.selected.id
                    if (!(selectedId instanceof ModuleComponentIdentifier) || isPlatformDependency(resolvedDependency)) {
                        return // no jar backs a platform/BOM dependency
                    }
                    resolvedArtifacts.findAll { it.id.componentIdentifier == selectedId }
                        .forEach { files.add(it.file) }
                }
                logger.info("resolveGradlePluginApiDependencyFiles: contributing {} tracked file(s): {}", files.size(), files)
                synchronized (trackedGradlePluginApiDependencyFiles) {
                    trackedGradlePluginApiDependencyFiles.addAll(files)
                }
            }
        }

        tasks.register('collectGradlePluginApiDependencies') { Task task ->
            SetProperty<String> nonJavaApiDependencies = project.nonJavaApiDependencies
            inputs.property('nonJavaApiDependencies', nonJavaApiDependencies)

            List<Configuration> inputConfs = [
                gradlePluginApiDependenciesConf,
            ]

            inputConfs.forEach { inputConf ->
                task.inputs.files(inputConf)
                    .optional()
                    .withNormalizer(ClasspathNormalizer)
                    .withPathSensitivity(PathSensitivity.RELATIVE)
                    .withPropertyName(inputConf.name)
            }

            SetProperty<String> platformDependencyNotations = project.objects.setProperty(String).value(project.provider {
                Collection<String> notation = new TreeSet<String>()
                inputConfs.forEach { Configuration inputConf ->
                    inputConf.allDependencies.forEach { Dependency dep ->
                        notation.add("${dep.group}:${dep.name}:${dep.version}")
                    }
                }
                return notation
            }).with { it.finalizeValueOnRead(); it }
            task.inputs.property('platformDependencyNotations', platformDependencyNotations)

            File outputFile = project.file("${project.layout.buildDirectory.asFile.get()}/gradle-plugin-api-dependencies.txt")
            outputs.file(outputFile).withPropertyName('outputFile')
            task.ext.outputFile = outputFile
            task.doFirst { outputFile.delete() }

            task.doLast {
                logger.info("collectGradlePluginApiDependencies: writing to {}", outputFile)
                outputFile.parentFile.mkdirs()

                Collection<String> dependencies = new TreeSet<String>()

                Collection<ResolvedArtifact> resolvedArtifacts = gradlePluginApiDependenciesConf.resolvedConfiguration.resolvedArtifacts

                Closure processResolvedDependency = { ResolvedDependencyResult resolvedDependency ->
                    ModuleComponentIdentifier id = resolvedDependency.selected.id.with { id ->
                        if (id instanceof ModuleComponentIdentifier) {
                            return id
                        } else {
                            return null
                        }
                    }
                    if (id == null) {
                        return
                    }

                    if (isPlatformDependency(resolvedDependency)) {
                        String notation = "${id.group}:${id.module}:${id.version}"
                        dependencies.add(notation)
                        return
                    }

                    Collection<ResolvedArtifact> dependencyArtifacts = resolvedArtifacts.findAll { it.id.componentIdentifier == id }
                    dependencyArtifacts.forEach { dependencyArtifact ->
                        String notation = "${id.group}:${id.module}:${id.version}:${dependencyArtifact.classifier ?: ''}@${dependencyArtifact.extension}"
                        notation = notation.replaceFirst(/:?@(jar)?$/, '')
                        dependencies.add(notation)
                    }
                }

                collectTrackedResolvedDependencies().forEach { processResolvedDependency(it) }

                nonJavaApiDependencies.get()
                    .findAll { it != null && !it.isEmpty() }
                    .forEach { dependencies.add(it) }

                logger.info("collectGradlePluginApiDependencies: writing {} line(s)", dependencies.size())
                outputFile.setText(dependencies.join('\n') + '\n', 'UTF-8')
            }
        }
    }
}

TaskProvider collectAllGradlePluginApiDependencies = tasks.register('collectAllGradlePluginApiDependencies') { Task task ->
    Closure<List<Task>> getCollectGradlePluginApiDependenciesTasks = {
        project.allprojects
            .findAll { it.pluginManager.hasPlugin('java-gradle-plugin') }
            .collect { it.tasks.getByName('collectGradlePluginApiDependencies') }
    }.memoize()
    task.dependsOn(project.provider { getCollectGradlePluginApiDependenciesTasks() })

    Closure<List<File>> getGradlePluginApiDependenciesFiles = {
        getCollectGradlePluginApiDependenciesTasks().collect { it.outputFile }
    }.memoize()
    task.inputs.files(project.provider { getGradlePluginApiDependenciesFiles() })
        .optional()
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .withPropertyName('gradlePluginApiDependenciesFiles')

    File outputFile = project.file("gradle-plugin-api-dependencies.txt")
    task.outputs.file(outputFile).withPropertyName('outputFile')
    task.ext.outputFile = outputFile
    task.doFirst { outputFile.delete() }

    task.doLast {
        outputFile.parentFile.mkdirs()

        Collection<String> dependencies = new TreeSet<String>()
        getGradlePluginApiDependenciesFiles().forEach { file ->
            file.getText('UTF-8').split(/\n/)
                .collect { it.replaceFirst(/#.*/, '') }
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
                .forEach { dependencies.add(it) }
        }
        outputFile.setText(
            [
                "# This file is generated automatically by `${it.name}` Gradle task.",
                '# Do not modify it yourself unless you know what you are doing.',
                '',
                dependencies.join('\n'),
                '',
            ].join('\n'),
            'UTF-8'
        )
    }
}

collectAllGradlePluginApiDependencies.get()

tasks.named('pushBackTasks') { dependsOn(collectAllGradlePluginApiDependencies) }
